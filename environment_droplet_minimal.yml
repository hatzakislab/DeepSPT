# Wider DeepSPT environment (python 3.10): the runtime core plus the imaging
# and analysis extras used by the upstream notebooks.
#
# VERIFICATION NOTE: only the pinned core below is what this port was tested
# against -- deepspt_src imports exactly those. The unpinned extras further
# down are carried over from the old python 3.8 spec for the upstream
# notebooks; they are left unpinned so pip can resolve py3.10-compatible
# builds, and they have NOT been verified here. Use DeepSPT_simple.yml or
# requirements.txt if you only need deepspt_src.
#
# Dropped deliberately, both impossible on python 3.10:
#   probfit          no cp310 wheel, and pins iminuit<2
#                    -> replaced by iminuit.cost.LeastSquares
#   pomegranate 0.14 Cython, no cp310 wheel
#                    -> replaced by the HiddenMarkovModel shim in
#                       deepspt_src/Fingerprint_functions.py, which still
#                       loads pub_simulated2D_HMM.json unchanged
name: simpleDeepSPT
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - ipykernel
  - pip:
    # --- verified core (what deepspt_src actually imports) ---
    - numpy==2.2.6
    - scipy==1.15.3
    - pandas==2.3.2
    - matplotlib==3.10.6
    - seaborn==0.13.2
    - plotly==5.24.0
    - scikit-learn==1.7.2
    - torch==2.8.0
    - tqdm==4.67.3
    - joblib==1.5.2
    - h5py==3.12.1
    - iminuit==2.30.1
    - fbm==0.3.0
    - similaritymeasures==1.4.0
    - pomegranate==1.1.2   # optional: torch backend for the HMM

    # --- unverified extras for the upstream notebooks ---
    - alphashape
    - imageio
    - imbalanced-learn
    - kaleido
    - natsort
    - nd2
    - networkx
    - numba
    - opencv-python
    - optuna
    - pillow
    - scikit-image
    - shap
    - shapely
    - tifffile
    - trackpy
    - trimesh
    - umap-learn
    # - mlflow          # optional: dead run-lookup helpers only
